<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料ダウンロード | たがし屋</title>
<meta name="description" content="たがし屋の各種資料をダウンロードいただけます。ドローン・映像制作・3DCGの料金表やご案内資料をこちらにまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F4;
    --bg-alt:#EDF1F0;
    --card:#FFFFFF;
    --ink:#1C2A33;
    --ink-soft:#55636B;
    --ink-faint:#8B979C;
    --line:#D7DEDC;
    --accent-drone:#2D6A8F;
    --accent-video:#6B5B95;
    --accent-3dcg:#B98235;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.06em;}
  a{color:inherit;}
  .wrap{max-width:820px; margin:0 auto; padding:0 28px;}

  .backlink{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    padding:20px 0;
  }
  .backlink:hover{color:var(--accent-drone);}

  header.page-head{padding:20px 0 50px;}
  .eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-faint);
    margin-bottom:14px;
  }
  .page-head h1{font-size:clamp(26px, 4vw, 34px); line-height:1.5;}
  .page-head p{color:var(--ink-soft); font-size:14.5px; margin-top:14px; max-width:34em;}

  .doc-group{margin-top:10px;}
  .doc-group + .doc-group{margin-top:48px;}
  .group-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label .swatch{width:8px; height:8px; display:inline-block;}

  .doc-list{
    display:grid;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .doc-card{
    background:var(--card);
    padding:22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }
  .doc-card .info h3{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:500;
    font-size:15px;
    margin-bottom:6px;
  }
  .doc-card .info p{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }
  .doc-card .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    margin-top:8px;
  }
  .dl-btn{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    text-decoration:none;
    color:#fff;
    background:var(--accent-drone);
    padding:11px 18px;
    border-radius:var(--radius);
    white-space:nowrap;
    transition:opacity 0.2s;
  }
  .dl-btn:hover, .dl-btn:focus-visible{opacity:0.85;}

  .empty-note{
    font-size:13px;
    color:var(--ink-faint);
    padding:22px 26px;
    background:var(--card);
    border:1px dashed var(--line);
  }

  @media (max-width:560px){
    .doc-card{flex-direction:column; align-items:flex-start;}
    .dl-btn{width:100%; justify-content:center;}
  }

  footer{padding:60px 0 60px; text-align:center;}
  footer .foot-brand{font-family:'Shippori Mincho', serif; font-size:13px; color:var(--ink-faint);}
</style>
</head>
<body>

<div class="wrap">
  <a class="backlink" href="index.html">← たがし屋トップへ戻る</a>
</div>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">DOWNLOADS</span>
    <h1>資料ダウンロード</h1>
    <p>ドローン・映像制作・3DCG、それぞれの資料をこちらからダウンロードいただけます。</p>
  </div>
</header>

<section>
  <div class="wrap">

    <div class="doc-group">
      <div class="group-label mono"><span class="swatch" style="background:var(--accent-drone)"></span>DRONE</div>
      <div class="doc-list">
        <div class="doc-card">
          <div class="info">
            <h3>ドローン撮影サービス 料金表</h3>
            <p>基本料金・オプション・ロケハン・出張費・キャンセル規定などをまとめた資料です。</p>
            <div class="meta">PDF</div>
          </div>
          <a class="dl-btn" href="files/drone-price-202606.pdf" download>ダウンロード</a>
        </div>
      </div>
    </div>

    <div class="doc-group">
      <div class="group-label mono"><span class="swatch" style="background:var(--accent-video)"></span>VIDEO</div>
      <div class="doc-list">
        <div class="empty-note">現在準備中です。</div>
      </div>
    </div>

    <div class="doc-group">
      <div class="group-label mono"><span class="swatch" style="background:var(--accent-3dcg)"></span>3DCG</div>
      <div class="doc-list">
        <div class="empty-note">現在準備中です。</div>
      </div>
    </div>

  </div>
</section>

<footer>
  <div class="foot-brand">たがし屋</div>
</footer>

</body>
</html>
