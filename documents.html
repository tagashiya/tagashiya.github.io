<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料ダウンロード | たがし屋</title>
<meta name="description" content="たがし屋の各種資料をダウンロードいただけます。ドローン・映像制作・3DCGの料金表やご案内資料をこちらにまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1E8;
    --bg-alt:#DCE6F2;
    --card:#FFFFFF;
    --ink:#1C2A33;
    --ink-soft:#55636B;
    --ink-faint:#8B979C;
    --line:#1B4B8A;
    --lapis:#1B4B8A;
    --gold:#C9A227;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--lapis);
  }
  .mono{font-family:'Noto Serif JP', serif; letter-spacing:0.06em;}
  a{color:inherit;}
  .wrap{max-width:820px; margin:0 auto; padding:0 28px;}

  .backlink{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    padding:20px 0;
  }
  .backlink:hover{color:var(--lapis);}

  header.page-head{padding:20px 0 50px;}
  .eyebrow{
    display:inline-block;
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--lapis);
    margin-bottom:14px;
  }
  .page-head h1{font-size:clamp(26px, 4vw, 34px); line-height:1.5;}
  .page-head p{color:var(--ink-soft); font-size:14.5px; margin-top:14px; max-width:34em;}

  .doc-group{margin-top:10px;}
  .doc-group + .doc-group{margin-top:48px;}
  .group-label{
    font-family:'Noto Serif JP', serif;
    font-size:11px;
    color:var(--lapis);
    letter-spacing:0.08em;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .picon{
    width:16px;
    height:16px;
    color:var(--lapis);
    flex-shrink:0;
  }

  .doc-list{
    display:grid;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .doc-card{
    background:var(--card);
    padding:22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }
  .doc-card .info h3{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:500;
    font-size:15px;
    margin-bottom:6px;
  }
  .doc-card .info p{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }
  .doc-card .meta{
    font-family:'Noto Serif JP', serif;
    font-size:10.5px;
    color:var(--ink-faint);
    margin-top:8px;
  }
  .dl-btn{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    text-decoration:none;
    color:#fff;
    background:var(--lapis);
    padding:11px 18px 9px;
    border-radius:var(--radius);
    border-bottom:3px solid var(--gold);
    white-space:nowrap;
    transition:opacity 0.2s;
  }
  .dl-btn:hover, .dl-btn:focus-visible{opacity:0.85;}

  .empty-note{
    font-size:13px;
    color:var(--ink-faint);
    padding:22px 26px;
    background:var(--card);
    border:1px dashed var(--line);
  }

  @media (max-width:560px){
    .doc-card{flex-direction:column; align-items:flex-start;}
    .dl-btn{width:100%; justify-content:center;}
  }

  footer{padding:60px 0 60px; text-align:center;}
  footer .foot-brand{font-family:'Shippori Mincho', serif; font-size:13px; color:var(--lapis);}
</style>
</head>
<body>

<div class="wrap">
  <a class="backlink" href="index.html">← たがし屋トップへ戻る</a>
</div>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">DOWNLOADS</span>
    <h1>資料ダウンロード</h1>
    <p>ドローン・映像制作・3DCG、それぞれの資料をこちらからダウンロードいただけます。</p>
  </div>
</header>

<section>
  <div class="wrap">

    <div class="doc-group">
      <div class="group-label mono"><svg class="picon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="6" height="6" rx="1"/><line x1="9" y1="9" x2="4" y2="4"/><line x1="15" y1="9" x2="20" y2="4"/><line x1="9" y1="15" x2="4" y2="20"/><line x1="15" y1="15" x2="20" y2="20"/><circle cx="4" cy="4" r="2.2"/><circle cx="20" cy="4" r="2.2"/><circle cx="4" cy="20" r="2.2"/><circle cx="20" cy="20" r="2.2"/></svg>DRONE</div>
      <div class="doc-list">
        <div class="doc-card">
          <div class="info">
            <h3>ドローン撮影サービス 料金表</h3>
            <p>基本料金・オプション・ロケハン・出張費・キャンセル規定などをまとめた資料です。</p>
            <div class="meta">PDF</div>
          </div>
          <a class="dl-btn" href="files/drone-price-202606.pdf" download>ダウンロード</a>
        </div>
      </div>
    </div>

    <div class="doc-group">
      <div class="group-label mono"><svg class="picon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M10 9.3l6 2.7-6 2.7z" fill="currentColor" stroke="none"/></svg>VIDEO</div>
      <div class="doc-list">
        <div class="empty-note">現在準備中です。</div>
      </div>
    </div>

    <div class="doc-group">
      <div class="group-label mono"><svg class="picon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12v9M12 12l8-4.5M12 12l-8-4.5"/></svg>3DCG</div>
      <div class="doc-list">
        <div class="empty-note">現在準備中です。</div>
      </div>
    </div>

  </div>
</section>

<footer>
  <div class="foot-brand">たがし屋</div>
</footer>

</body>
</html>
